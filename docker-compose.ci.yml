
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_app_ci
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: task_manager_db_ci
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: task_manager_1
      MYSQL_DATABASE: task_manager_ci
    tmpfs:
      - /var/lib/mysql
    healthcheck:  
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 5s
      retries: 10
      start_period: 30s
      interval: 10s
