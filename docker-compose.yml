
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - php_data:/var/www/html/var
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql://admin:task_manager_1@db:3306/task_manager_fixed
      - APP_ENV=dev
      - APP_SECRET=change_this_secret_123
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: task_manager_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: task_manager_1
      MYSQL_DATABASE: task_manager_fixed
      MYSQL_USER: admin
      MYSQL_PASSWORD: task_manager_1
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: task_manager_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_USER: admin                  # Twój użytkownik
      PMA_PASSWORD: task_manager_1  
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db_data:
      driver: local
  php_data:
      driver: local

networks:
  app-network:
    driver: bridge